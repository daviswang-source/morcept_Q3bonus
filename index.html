<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>默聲創意 · 季度獎金計算</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#151C31;--gold:#F8CB2A;--bg:#f5f4f0;--surface:#fff;--border:#e5e3dc;
  --t1:#1a1a18;--t2:#444;--t3:#888;
  --green:#16a34a;--blue:#2563eb;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;
  --s2:#f7f6f2;--s3:#eeece6;
}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:15px}
/* Login */
.login-wrap{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999;overflow-y:auto}
.login-box{background:#fff;border-radius:16px;padding:28px 24px;width:360px;margin:20px auto}
.login-logo{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:2px}
.login-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.login-group{margin-bottom:10px}
.login-group-label{font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:600}
.login-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.login-btns.col3{grid-template-columns:1fr 1fr 1fr}
.member-btn{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--s2);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:7px;transition:.15s;text-align:left}
.member-btn:hover{border-color:var(--navy);background:var(--navy);color:#fff}
.mb-av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.member-btn:hover .mb-av{background:rgba(255,255,255,.2)}
/* Header */
.hdr{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.hdr-title{font-size:15px;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:10px}
.season-sel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:4px 8px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer}
.who-badge{background:var(--gold);color:var(--navy);font-weight:700;padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer}
/* Nav */
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.nav-tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;transition:.15s}
.nav-tab.on{color:var(--navy);border-bottom-color:var(--gold)}
/* Main */
.main{max-width:900px;margin:0 auto;padding:16px}
/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card-hdr{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-body{padding:14px 16px}
/* Form */
.field-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.field-label{font-size:12px;color:var(--t2);min-width:90px;flex-shrink:0}
.fi{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--s2);transition:.15s}
.fi:focus{outline:none;border-color:var(--blue);background:#fff}
.fi:disabled{opacity:.6;cursor:not-allowed}
.fi-sm{width:90px}.fi-md{width:130px}
.unit{font-size:12px;color:var(--t3);flex-shrink:0}
.add-btn{padding:6px 12px;background:var(--s2);border:1.5px dashed var(--border);border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--t3);transition:.15s}
.add-btn:hover{border-color:var(--blue);color:var(--blue)}
.del-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--t3);font-size:16px;flex-shrink:0;border-radius:4px;display:flex;align-items:center;justify-content:center}
.del-btn:hover{background:var(--s3);color:var(--red)}
/* Result */
.result-bar{background:linear-gradient(135deg,var(--navy),#2a3550);border-radius:10px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.result-label{font-size:11px;opacity:.7;margin-bottom:3px}
.result-amount{font-size:22px;font-weight:800}
.result-detail{font-size:10px;opacity:.6;margin-top:2px}
/* Score bars */
.score-track{height:7px;background:var(--s3);border-radius:4px;overflow:hidden;margin-bottom:4px}
.score-fill{height:100%;border-radius:4px;transition:width .4s}
/* Table */
.task-table{width:100%;border-collapse:collapse;font-size:12px}
.task-table th{text-align:left;padding:7px 9px;color:var(--t3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.task-table td{padding:7px 9px;border-bottom:1px solid var(--s3);vertical-align:middle}
.task-table tr:last-child td{border-bottom:none}
.task-table tr:hover td{background:var(--s2)}
/* Pills */
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.pill-green{background:#dcfce7;color:#166534}
.pill-orange{background:#fff7ed;color:#9a3412}
.pill-blue{background:#eff6ff;color:#1d4ed8}
.pill-gray{background:var(--s3);color:var(--t3)}
.pill-purple{background:#f3e8ff;color:#6b21a8}
.pill-yellow{background:#fefce8;color:#854d0e}
/* Notice */
.notice{background:#fefce8;border:1px solid #fde047;border-radius:8px;padding:9px 12px;font-size:12px;color:#78600a;margin-bottom:10px;line-height:1.6}
/* Misc */
.sec-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;margin-top:14px}
.sec-label:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.mini-stat{background:var(--s2);border-radius:8px;padding:10px 12px;text-align:center}
.mini-stat-val{font-size:18px;font-weight:800;margin-bottom:1px}
.mini-stat-lbl{font-size:10px;color:var(--t3)}
.divider{height:1px;background:var(--border);margin:12px 0}
.team-chip{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.action-btn{padding:7px 16px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-green{background:#16a34a;color:#fff}
.btn-green:hover{opacity:.85}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{opacity:.85}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{opacity:.85}
select.fi{cursor:pointer}
/* Sub tabs */
.sub-nav{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sub-tab{padding:9px 14px;background:none;border:none;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:.15s}
.sub-tab.on{color:var(--navy);border-bottom-color:var(--gold)}
/* Toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:5px}
.toast{padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s}
.toast-ok{background:#166534;color:#fff}
.toast-err{background:#991b1b;color:#fff}
.toast-info{background:#1d4ed8;color:#fff}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.hidden{display:none!important}
/* Case card in flow */
.case-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.case-card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.case-meta{font-size:11px;color:var(--t3);line-height:1.6}
</style>
</head>
<body>

<div class="login-wrap" id="login-page">
  <div class="login-box">
    <div class="login-logo">默聲創意</div>
    <div class="login-sub">季度獎金計算 · 請選擇帳號</div>
    <div id="login-groups"></div>
    <div style="margin-top:12px;text-align:center;font-size:12px;color:var(--t3);cursor:pointer" onclick="loginAs('admin')">其他管理者登入</div>
  </div>
</div>

<div class="hdr">
  <div class="hdr-title">💰 季度獎金計算</div>
  <div class="hdr-right">
    <select class="season-sel" id="season-sel" onchange="onSeasonChange()">
      <option value="2026-Q3">2026 Q3（7-9月）</option>
      <option value="2026-Q4">2026 Q4（10-12月）</option>
      <option value="2027-Q1">2027 Q1（1-3月）</option>
    </select>
    <div class="who-badge" id="who-badge" onclick="logout()">登出</div>
  </div>
</div>

<div class="nav" id="main-nav"></div>

<div class="main">
  <div id="pane-sales" class="hidden"><div id="sales-content"></div></div>
  <div id="pane-pm" class="hidden"><div id="pm-content"></div></div>
  <div id="pane-maint" class="hidden"><div id="maint-content"></div></div>
  <div id="pane-design" class="hidden"><div id="design-content"></div></div>
  <div id="pane-murphy" class="hidden"><div id="murphy-content"></div></div>
  <div id="pane-admin" class="hidden"><div id="admin-content"></div></div>
</div>
<div id="toast-wrap"></div>

<script>
// ══ 常數 ══
const STORAGE_KEY='morcept_bonus_v1';
const CFG_KEY='morcept_cfg_v1';

const MEMBERS={
  murphy: {name:'Murphy', dept:'mgmt',   role:'super'},  // 最高管理者
  annie:  {name:'Annie',  dept:'sales',  role:'member'},
  sandra: {name:'Sandra', dept:'sales',  role:'member'},
  elena:  {name:'Elena',  dept:'sales',  role:'assist'},
  daniel: {name:'Daniel', dept:'pm',     role:'member'},
  davis:  {name:'Davis',  dept:'pm',     role:'admin'},
  shanna: {name:'Shanna', dept:'pm',     role:'member'},
  jessie: {name:'Jessie', dept:'maint',  role:'member'},
  putting:{name:'布丁',   dept:'design', role:'exec'},
  rori:   {name:'RORI',   dept:'design', role:'exec'},
  mina:   {name:'MINA',   dept:'design', role:'exec'},
  john:   {name:'John',   dept:'design', role:'collab'},
  lisa:   {name:'Lisa',   dept:'design', role:'collab'},
  admin:  {name:'管理者', dept:'mgmt',   role:'admin'},
};

// 案件狀態流程
// 'pending_murphy' → 'pending_pm' → 'in_progress' → 'pending_design' → 'designing' → 'done'
const CASE_STATUS={
  pending_murphy: '待指派PM',
  pending_pm:     '待PM確認',
  in_progress:    'PM執行中',
  pending_design: '待設計分派',
  designing:      '設計中',
  done:           '已結案',
  void:           '已作廢',
};

let CFG={
  pool:{sales:110000,pm:80000,maint:20000,design:100000},
  salesMainPool:90000,
  salesMainCount:2,salesAssistCount:1,
  salesSplit:{contract:0.65,team:0.35},
  salesThresholds:[{amt:500000,pct:.6},{amt:700000,pct:.8},{amt:900000,pct:1.0}],
  pmCount:3,
  pmScoreAchieve:60,
  pmScoreBase:{follow:25,cross:15},
  pmExtraMax:20,
  pmTeamBonus:10000,
  planScores:{'單頁式網站':2,'標準多頁':3,'平面':4,'品牌型錄':6,'多語型錄':8,'購物車':10,'SEO附加':4},
  maintThresholds:[{rate:92,score:60},{rate:95,score:80},{rate:100,score:100}],
  maintExtraMax:20,
  design:{execRatio:.6,collabRatio:.3,leadRatio:.1,extraMax:20},
};

let CUR_USER=null, CUR_SEASON='2026-Q3';
let DB={};

// ══ 資料存取 ══
function loadDB(){try{const r=localStorage.getItem(STORAGE_KEY);if(r){DB=JSON.parse(r);migrateLegacyData();}}catch(e){DB={};}}
function loadCFG(){try{const r=localStorage.getItem(CFG_KEY);if(r)Object.assign(CFG,JSON.parse(r));}catch(e){}}
function saveDB(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));toast('已儲存','ok');}catch(e){toast('儲存失敗','err');}}
function saveCFG(){try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}catch(e){}}

function getSeason(){if(!DB[CUR_SEASON])DB[CUR_SEASON]={cases:[],sales:{},pm:{},maint:{},design:{}};return DB[CUR_SEASON];}
function getCases(){return getSeason().cases||(getSeason().cases=[]);}

// ── 相容層：舊資料 designId:'bevic' 自動轉成 'shanna' ──
function migrateLegacyData(){
  let dirty=false;
  Object.values(DB).forEach(season=>{
    if(!season.cases)return;
    season.cases.forEach(c=>{
      if(c.designId==='bevic'){c.designId='shanna';dirty=true;}
    });
  });
  if(dirty){saveDB();console.log('[migration] bevic → shanna 完成');}
}
function getSales(who){const s=getSeason();if(!s.sales[who])s.sales[who]={deposits:[]};return s.sales[who];}
function getPM(who){const s=getSeason();if(!s.pm[who])s.pm[who]={followOk:0,followTotal:0,crossOk:0,crossTotal:0,extra:0};return s.pm[who];}
function getMaint(){
  const s=getSeason();
  if(!s.maint.jessie)s.maint.jessie={
    total:0, exclude:0, renewed:0, extra:0,
    yr3:0,    // 本季續約3年以上件數（Jessie填）
    yr5:0,    // 本季續約5年以上件數（Jessie填）
    yr3Min:3, // 觸發20%加成所需3年以上件數（主管設定，預設3）
    yr5Min:2, // 觸發50%加成所需5年以上件數（主管設定，預設2）
  };
  return s.maint.jessie;
}
function getDesignGlobal(){
  const s=getSeason();
  if(!s.design)s.design={};
  if(!s.design.global)s.design.global={johnOk:false,lisaOk:false};
  return s.design.global;
}
function uid(){return '_'+Math.random().toString(36).slice(2,8);}
function fmt(n){return 'NT$'+(Math.round(n)||0).toLocaleString();}
function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;el.textContent=msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(),2200);
}
function isSuper(who){return who==='murphy';}
function isAdmin(who){return who==='admin'||who==='davis'||who==='murphy'||MEMBERS[who]?.role==='admin'||MEMBERS[who]?.role==='super';}
function isMurphy(who){return who==='murphy';}

// ══ Login / Nav ══
function buildLoginList(){
  const groups=[
    {label:'👑 管理者',ids:['murphy'],cols:1},
    {label:'💼 業務',  ids:['annie','sandra','elena'],cols:2},
    {label:'📋 專案',  ids:['daniel','davis','shanna'],cols:2},
    {label:'🔧 維運',  ids:['jessie'],cols:1},
    {label:'🎨 設計',  ids:['putting','rori','mina','john','lisa'],cols:3},
  ];
  document.getElementById('login-groups').innerHTML=groups.map(g=>`
    <div class="login-group">
      <div class="login-group-label">${g.label}</div>
      <div class="login-btns ${g.cols===3?'col3':''}">
        ${g.ids.map(id=>`<button class="member-btn" onclick="loginAs('${id}')">
          <div class="mb-av">${MEMBERS[id].name[0]}</div>
          <span>${MEMBERS[id].name}</span>
        </button>`).join('')}
      </div>
    </div>`).join('');
}

function loginAs(id){
  CUR_USER=id;
  document.getElementById('login-page').style.display='none';
  document.getElementById('who-badge').textContent=MEMBERS[id]?.name||'管理者';
  buildNav(id);
  const defaultTab=getDefaultTab(id);
  curTab=defaultTab;
  showPane(defaultTab);
  renderCurrentTab();
}
function getDefaultTab(id){
  const m=MEMBERS[id];
  if(!m||m.dept==='mgmt') return isMurphy(id)?'murphy':'admin';
  if(m.dept==='sales') return 'sales';
  if(m.dept==='pm') return 'pm';
  if(m.dept==='maint') return 'maint';
  if(m.dept==='design') return 'design';
  return 'admin';
}
function buildNav(id){
  const tabs=getVisibleTabs(id);
  document.getElementById('main-nav').innerHTML=tabs.map(t=>
    `<button class="nav-tab" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');
}
function getVisibleTabs(id){
  const m=MEMBERS[id];
  const role=m?.role;
  const dept=m?.dept;
  const all=[
    {id:'sales',  label:'💼 業務'},
    {id:'pm',     label:'📋 專案'},
    {id:'maint',  label:'🔧 維運'},
    {id:'design', label:'🎨 設計'},
    {id:'murphy', label:'👑 指派'},
    {id:'admin',  label:'⚙️ 管理'},
  ];
  if(isMurphy(id)) return all;
  if(isAdmin(id)) return all.filter(t=>t.id!=='murphy');
  if(dept==='sales') return [all[0]];
  if(dept==='pm') return [all[1]];
  if(dept==='maint') return [all[2]];
  if(dept==='design') return [all[3]];
  return [];
}
function logout(){CUR_USER=null;document.getElementById('login-page').style.display='flex';}
function onSeasonChange(){CUR_SEASON=document.getElementById('season-sel').value;renderCurrentTab();}

let curTab='sales';
function switchTab(tab){
  curTab=tab;
  showPane(tab);
  document.querySelectorAll('.nav-tab').forEach(b=>{
    b.classList.toggle('on',b.getAttribute('onclick')?.includes("'"+tab+"'"));
  });
  renderCurrentTab();
}
function showPane(tab){
  ['sales','pm','maint','design','murphy','admin'].forEach(t=>{
    document.getElementById('pane-'+t)?.classList.toggle('hidden',t!==tab);
  });
}
function renderCurrentTab(){
  if(curTab==='sales')  renderSalesPane();
  else if(curTab==='pm') renderPMPane();
  else if(curTab==='maint') renderMaintPane();
  else if(curTab==='design') renderDesignPane();
  else if(curTab==='murphy') renderMurphyPane();
  else if(curTab==='admin') renderAdminPane();
  // highlight nav
  document.querySelectorAll('.nav-tab').forEach(b=>{
    b.classList.toggle('on',b.getAttribute('onclick')?.includes("'"+curTab+"'"));
  });
}
function seasonLabel(){
  return {'2026-Q3':'2026 Q3（7-9月）','2026-Q4':'2026 Q4（10-12月）','2027-Q1':'2027 Q1（1-3月）'}[CUR_SEASON]||CUR_SEASON;
}

// ══════════════════════
// 案件核心邏輯
// ══════════════════════
function addCase(salesId, client, caseType, plan, seoAdd, customAdd, flatDesc, quote, deposit){
  const cases=getCases();
  const c={
    id:uid(),
    salesId,
    client,
    caseType,
    plan,
    seoAdd,    // bool
    customAdd, // bool（客製附加）
    flatDesc,
    quote:+quote||0,
    deposit:+deposit||0,
    pmId:null,
    designId:null,
    status:'pending_murphy',
    createdAt:Date.now(),
    pmNote:'',
  };
  cases.push(c);
  saveDB();
  return c;
}
function getCasesByStatus(status){return getCases().filter(c=>c.status===status);}
function getCasesByPM(pmId){return getCases().filter(c=>c.pmId===pmId);}
function getCasesByDesigner(designId){return getCases().filter(c=>c.designId===designId);}
function getCasesByDesignType(type){
  // type: 'web' | 'flat'
  return getCases().filter(c=>c.caseType===type&&['pending_design','designing','done'].includes(c.status));
}
function getPlanScore(c){
  if(!c)return 0;
  let s=CFG.planScores[c.plan]||0;
  if(c.caseType==='flat')s=CFG.planScores['平面']||4;
  if(c.seoAdd)s+=CFG.planScores['SEO附加']||4;
  return s;
}
function caseStatusLabel(s){return CASE_STATUS[s]||s;}
function caseStatusPill(s){
  const cls={pending_murphy:'pill-orange',pending_pm:'pill-yellow',in_progress:'pill-blue',
             pending_design:'pill-purple',designing:'pill-blue',done:'pill-green',void:'pill-gray'};
  return `<span class="pill ${cls[s]||'pill-gray'}">${caseStatusLabel(s)}</span>`;
}
function caseCard(c,actions=''){
  const score=getPlanScore(c);
  const coef=c.complexCoef||1.0;
  const achieveScore=c.status==='done'?Math.round(score*coef*10)/10:0;
  return `<div class="case-card">
    <div class="case-card-hdr">
      <div>
        <div style="font-weight:700;font-size:13px;margin-bottom:3px">${c.client||'（未填客戶）'}</div>
        <div class="case-meta">

// 銷售計算
function calcSalesBonus(tid){
  const myCases=getCases().filter(c=>c.salesId===tid&&c.status!=='void');
  // 接案獎金門檻：只看訂金累積
  const depositTotal=myCases.reduce((s,c)=>s+(+c.deposit||0),0);
  // 結案業績統計（另外顯示，不影響接案獎金門檻）
  const doneTotal=myCases.filter(c=>c.status==='done').reduce((s,c)=>s+(+c.quote||0),0);
  const doneCount=myCases.filter(c=>c.status==='done').length;
  const thresholds=CFG.salesThresholds;
  let contractPct=0;
  for(const th of [...thresholds].sort((a,b)=>b.amt-a.amt)){if(depositTotal>=th.amt){contractPct=th.pct;break;}}
  const contractPool=CFG.salesMainPool*CFG.salesSplit.contract;
  const perMain=CFG.salesMainCount>0?contractPool/CFG.salesMainCount:0;
  const contractBonus=perMain*contractPct;
  return {depositTotal,doneTotal,doneCount,contractPct,contractBonus,perMain};
}
function calcAutoTeamRate(){
  const cases=getCases().filter(c=>c.pmId&&c.caseType==='web'&&c.status!=='void');
  const total=cases.length, done=cases.filter(c=>c.status==='done').length;
  return {totalTasks:total,doneTasks:done,rate:total>0?done/total:0};
}
function setManualTeamRate(val){
  const s=getSeason();if(!s.sales)s.sales={};
  s.sales.manualTeamRate=(val===''||val==null)?null:Math.min(100,Math.max(0,+val));
  saveDB();updateTeamResult();
}

function calcPMScore(tid){
  const d=getPM(tid);
  const myCases=getCasesByPM(tid).filter(c=>c.status!=='void');
  const achieveMax=CFG.pmScoreAchieve;
  let achieveRaw=0;
  myCases.filter(c=>c.status==='done').forEach(c=>{
    const base=getPlanScore(c);
    const coef=+(c.complexCoef||1.0);
    achieveRaw+=base*coef;
  });
  const achieveScore=Math.min(Math.round(achieveRaw*10)/10,achieveMax);
  const followMax=CFG.pmScoreBase.follow;
  const followTotal=+d.followTotal||0;
  const followMiss=Math.min(+d.followMiss||0,followTotal);
  const followScore=Math.round(followMax*(followTotal>0?(followTotal-followMiss)/followTotal:0)*10)/10;
  const crossMax=CFG.pmScoreBase.cross;
  const crossTotal=+d.crossTotal||0;
  const crossOk=Math.min(+d.crossOk||0,crossTotal);
  const crossScore=Math.round(crossMax*(crossTotal>0?crossOk/crossTotal:0)*10)/10;
  const extra=Math.min(+d.extra||0,CFG.pmExtraMax);
  const baseScore=followScore+crossScore;
  const totalScore=Math.min(achieveScore+baseScore+extra,100);
  const teamBonus=getSeason().pm?.teamBonus?Math.round(CFG.pmTeamBonus/CFG.pmCount):0;
  const share=CFG.pool.pm/CFG.pmCount;
  const bonus=Math.round(share*(totalScore/100))+teamBonus;
  return {achieveScore,achieveRaw,achieveMax,followScore,followMax,followTotal,followMiss,
          crossScore,crossMax,crossTotal,crossOk,extra,baseScore,totalScore,bonus,share,teamBonus};
}

function setMaintField(key,val){const d=getMaint();d[key]=val;saveDB();renderMaintPane();}
function calcMaintScore(){
  const d=getMaint();
  const total=+d.total||0,excl=Math.min(+d.exclude||0,total),valid=total-excl;
  const renewed=Math.min(+d.renewed||0,valid);
  const renewRate=valid>0?Math.round(renewed/valid*100):0;
  const ths=[...CFG.maintThresholds].sort((a,b)=>a.rate-b.rate);
  let renewScore=0,reached=null;
  for(const t of ths)if(renewRate>=t.rate)reached=t;
  if(reached){
    const idx=ths.indexOf(reached),next=ths[idx+1];
    renewScore=next?Math.round(reached.score+(renewRate-reached.rate)/(next.rate-reached.rate)*(next.score-reached.score)):reached.score;
  }
  const extra=Math.min(+d.extra||0,CFG.maintExtraMax);
  const cappedScore=Math.min(renewScore+extra,100);
  const baseBonus=Math.round(CFG.pool.maint*cappedScore/100);

  // ── 多年續約加成（最多 1W，取最高）──
  const multiBonus=CFG.pool.maint*0.5; // 加成池上限 = 主池的50% = 最多1W（若主池2W）
  const yr3=+d.yr3||0, yr5=+d.yr5||0;
  const yr3Min=+d.yr3Min||3, yr5Min=+d.yr5Min||2;
  let multiRate=0, multiLabel='';
  if(yr5>=yr5Min){
    multiRate=0.5; multiLabel=`${yr5}件5年以上 ≥ ${yr5Min}件門檻 → +50%`;
  } else if(yr3>=yr3Min){
    multiRate=0.2; multiLabel=`${yr3}件3年以上 ≥ ${yr3Min}件門檻 → +20%`;
  } else {
    multiLabel=`3年以上 ${yr3}/${yr3Min}件，5年以上 ${yr5}/${yr5Min}件，未達門檻`;
  }
  const multiBonus_actual=Math.round(multiBonus*multiRate);
  const totalBonus=baseBonus+multiBonus_actual;

  return {total,valid,renewed,renewRate,renewScore,extra,cappedScore,
    baseBonus,multiBonus,multiRate,multiLabel,multiBonus_actual,totalBonus,
    yr3,yr5,yr3Min,yr5Min};
}

function calcDesignBonus(){
  const pool=CFG.pool.design||0;
  const d=CFG.design;
  const teamBonusPerPerson=2000; // 原Bevic部長獎金1萬改為全員團隊績效，每人2000
  const teamBonusTotal=teamBonusPerPerson*5; // 5人共1萬
  const execPool=Math.round(pool*d.execRatio);
  const collabPool=pool-execPool; // leadRatio停用，剩餘給協作池
  const execIds=['putting','rori','mina'];
  const execAmts={},execBonus={};
  let totalAmt=0;
  execIds.forEach(id=>{
    const amt=getCasesByDesigner(id).filter(c=>c.status==='done'&&c.status!=='void').reduce((s,c)=>s+(+c.quote||0),0);
    execAmts[id]=amt;totalAmt+=amt;
  });
  execIds.forEach(id=>{execBonus[id]=totalAmt>0?Math.round(execAmts[id]/totalAmt*execPool):0;});
  const allDesign=getCases().filter(c=>c.designId);
  const doneDesign=allDesign.filter(c=>c.status==='done');
  const deptRate=allDesign.length>0?doneDesign.length/allDesign.length:0;
  const deptReached=deptRate>=0.6;
  const g=getDesignGlobal();
  // 協作池（John/Lisa）
  const johnTeam=deptReached?Math.round(collabPool/2):0;
  const lisaTeam=deptReached?Math.round(collabPool/2):0;
  const johnIndv=deptReached&&g.johnOk?Math.round(pool*.05):0;
  const lisaIndv=deptReached&&g.lisaOk?Math.round(pool*.05):0;
  // 設計部全員團隊績效（原Bevic部長獎金改制）
  const teamBonus=deptReached?teamBonusPerPerson:0; // 每人可領金額
  const bevicBonus=0;
  const extra=+g.extra||0;
  return {execPool,collabPool,leadPool:0,execAmts,totalAmt,execBonus,
    deptRate,deptReached,johnTeam,lisaTeam,johnIndv,lisaIndv,bevicBonus,
    teamBonus,teamBonusTotal,extra};
}

  el.innerHTML=`
    <!-- 維運協助確認 -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-hdr"><div class="card-title">🤝 維運協助加碼確認</div></div>
      <div class="card-body">
        <div style="font-size:12px;color:var(--t3);margin-bottom:10px">三條件同時達標 → Daniel/Shanna/Davis 各 ${fmt(CFG.pmTeamBonus/CFG.pmCount)}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${[['1','✅ 達成',true],['0','❌ 未達成',false],['null','— 待確認',undefined]].map(([v,lbl,val])=>`
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
            <input type="radio" name="team-bonus-adm" value="${v}"
              ${s.pm?.teamBonus===val?'checked':''}
              onchange="setTeamBonus(${val===undefined?'undefined':val});renderAdminSummary()">
            ${lbl}
          </label>`).join('')}
          ${s.pm?.teamBonus?`<span style="font-weight:700;color:var(--green)">各 ${fmt(CFG.pmTeamBonus/CFG.pmCount)}</span>`:''}
        </div>
      </div>
    </div>

    <!-- 總覽表 -->
    <div class="card" style="margin-bottom:12px">
      <div class="card-hdr"><div class="card-title">📊 ${seasonLabel()} 獎金總覽</div></div>
      <div class="card-body" style="padding:0">
        <table class="task-table">
          <thead><tr><th>人員</th><th>部門</th><th>第一欄</th><th>第二欄</th><th>加分</th><th>預估合計</th></tr></thead>
          <tbody>
            <tr><td><strong>Annie</strong></td><td style="color:var(--t3)">業務</td><td>${fmt(annie.contractBonus)}</td><td>${fmt(each)}</td><td>—</td><td><strong style="color:var(--green)">${fmt(annie.contractBonus+each)}</strong></td></tr>
            <tr><td><strong>Sandra</strong></td><td style="color:var(--t3)">業務</td><td>${fmt(sandra.contractBonus)}</td><td>${fmt(each)}</td><td>—</td><td><strong style="color:var(--green)">${fmt(sandra.contractBonus+each)}</strong></td></tr>
            <tr><td><strong>Elena</strong></td><td style="color:var(--t3)">業務助理</td><td colspan="3" style="color:var(--t3);font-size:12px">${elenaT}/${CFG.salesMainCount}位達標</td><td><strong style="color:var(--green)">${fmt(elenaB)}</strong></td></tr>
            <tr style="background:var(--s2)"><td colspan="6" style="padding:5px 9px;font-size:10px;color:var(--t3)">── 專案部 ──</td></tr>
            ${['daniel','davis','shanna'].map(id=>{
              const d=id==='daniel'?daniel:id==='davis'?davis:shanna;
              const ta=s.pm?.teamBonus?Math.round(CFG.pmTeamBonus/CFG.pmCount):0;
              return `<tr><td><strong>${MEMBERS[id].name}</strong></td><td style="color:var(--t3)">專案</td>
                <td>${Math.round(d.achieveScore)}分</td><td>${Math.round(d.baseScore)}分</td>
                <td>${Math.round(d.extra)}分${ta?` +${fmt(ta)}`:''}</td>
                <td><strong style="color:var(--green)">${fmt(d.bonus)}</strong></td></tr>`;
            }).join('')}
            <tr><td><strong>Jessie</strong></td><td style="color:var(--t3)">維運</td><td>${maint.renewRate}%</td><td>${maint.cappedScore}分${maint.multiRate>0?' +'+Math.round(maint.multiRate*100)+'%':''}</td><td>—</td><td><strong style="color:var(--green)">${fmt(maint.totalBonus)}</strong></td></tr>
            <tr style="background:var(--s2)"><td colspan="6" style="padding:5px 9px;font-size:10px;color:var(--t3)">── 設計部 · 執案池 ${fmt(dr.execPool)}，總結案金額 ${fmt(dr.totalAmt)}${dr.deptReached?' · 全員團隊績效各 '+fmt(dr.teamBonus):''}  ──</td></tr>
            ${['putting','rori','mina'].map(id=>`<tr><td><strong>${MEMBERS[id].name}</strong></td><td style="color:var(--t3)">執案</td>
              <td>${fmt(dr.execAmts[id]||0)}</td><td>${dr.totalAmt>0?Math.round((dr.execAmts[id]||0)/dr.totalAmt*100):0}%</td><td>${dr.teamBonus?'+'+fmt(dr.teamBonus):''}</td>
              <td><strong style="color:var(--green)">${fmt((dr.execBonus[id]||0)+(dr.teamBonus||0))}</strong></td></tr>`).join('')}
            <tr><td><strong>John</strong></td><td style="color:var(--t3)">協作</td><td>團 ${fmt(dr.johnTeam)}</td><td>個 ${fmt(dr.johnIndv)}</td><td>${dr.teamBonus?'+'+fmt(dr.teamBonus):''}</td><td><strong style="color:var(--green)">${fmt(dr.johnTeam+dr.johnIndv+(dr.teamBonus||0))}</strong></td></tr>
            <tr><td><strong>Lisa</strong></td><td style="color:var(--t3)">協作</td><td>團 ${fmt(dr.lisaTeam)}</td><td>個 ${fmt(dr.lisaIndv)}</td><td>${dr.teamBonus?'+'+fmt(dr.teamBonus):''}</td><td><strong style="color:var(--green)">${fmt(dr.lisaTeam+dr.lisaIndv+(dr.teamBonus||0))}</strong></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="result-bar">
      <div><div class="result-label">本季預估總發放</div><div class="result-amount">${fmt(total)}</div></div>
      <div style="text-align:right;font-size:12px;opacity:.7">獎金池 ${fmt(CFG.pool.sales+CFG.pool.pm+CFG.pool.maint+CFG.pool.design)}</div>
    </div>`;
}

function renderAdminPool(){
  const el=document.getElementById('admin-sub');
  if(!el)return;
  el.innerHTML=`
    <div class="card">
      <div class="card-hdr"><div class="card-title">⚙️ 獎金池設定</div></div>
      <div class="card-body">
        <div class="notice">修改後點儲存即時更新</div>
        <div class="sec-label">各部門獎金池</div>
        <div class="g2">
          ${[['業務部總池','pool.sales'],['主要業務池','salesMainPool'],['專案部總池','pool.pm'],['維運部總池','pool.maint'],['設計部總池','pool.design']].map(([lbl,key])=>`
          <div class="field-row">
            <span class="field-label" style="min-width:130px">${lbl}</span>
            <input class="fi fi-sm" type="number" value="${getNestedCFG(key)||0}"
              oninput="setNestedCFG('${key}',+this.value)">
            <span class="unit">元</span>
          </div>`).join('')}
        </div>

        <div class="divider"></div>
        <div class="sec-label">業務設定</div>
        <div class="field-row">
          <span class="field-label" style="min-width:130px">接案比例</span>
          <input class="fi fi-sm" type="number" min="0" max="100"
            value="${Math.round((CFG.salesSplit?.contract||0.65)*100)}"
            oninput="CFG.salesSplit.contract=+this.value/100;CFG.salesSplit.team=1-CFG.salesSplit.contract">
          <span class="unit">%（其餘為合作）</span>
        </div>
        <div class="field-row">
          <span class="field-label" style="min-width:130px">手動結案率覆蓋</span>
          <input class="fi fi-sm" type="number" min="0" max="100"
            value="${getSeason().sales?.manualTeamRate??''}" placeholder="自動"
            oninput="setManualTeamRate(this.value)">
          <span class="unit">%（留空=自動）</span>
        </div>
        <div class="divider"></div>
        <div class="sec-label">維運協助確認</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          ${[['1','✅ 達成',true],['0','❌ 未達成',false],['null','— 待確認',undefined]].map(([v,lbl,val])=>`
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px">
            <input type="radio" name="team-bonus-pool" value="${v}"
              ${getSeason().pm?.teamBonus===val?'checked':''}
              onchange="setTeamBonus(${val===undefined?'undefined':val})">
            ${lbl}
          </label>`).join('')}
        </div>
        <button onclick="saveCFG();saveDB();toast('設定已儲存','ok')" style="margin-top:14px;padding:9px 24px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600">💾 儲存設定</button>
      </div>
    </div>`;
}

function getNestedCFG(key){const parts=key.split('.');let v=CFG;for(const p of parts)v=v?.[p];return v??'';}
function setNestedCFG(key,val){const parts=key.split('.');let v=CFG;for(let i=0;i<parts.length-1;i++)v=v[parts[i]];v[parts[parts.length-1]]=val;}

// ── Init ──
loadDB();loadCFG();buildLoginList();
</script>
</body>
</html>
