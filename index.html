<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>默聲創意 · 季度獎金計算</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyBJdC0u4t31-6bsLBNxwpUQZpeVq0Leou0",
    authDomain: "morcept-bonus.firebaseapp.com",
    projectId: "morcept-bonus",
    storageBucket: "morcept-bonus.firebasestorage.app",
    messagingSenderId: "143426898008",
    appId: "1:143426898008:web:0b57b95917dbeccd01e22d"
  };
  const fbApp = initializeApp(firebaseConfig);
  const fbDB  = getFirestore(fbApp);
  window.__fb = { doc, getDoc, setDoc, onSnapshot, db: fbDB };
  window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#151C31;--gold:#F8CB2A;--bg:#f5f4f0;--surface:#fff;--border:#e5e3dc;
  --t1:#1a1a18;--t2:#444;--t3:#888;
  --green:#16a34a;--blue:#2563eb;--orange:#d97706;--red:#dc2626;--purple:#7c3aed;
  --s2:#f7f6f2;--s3:#eeece6;
}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;font-size:15px}
/* Login */
.login-wrap{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999;overflow-y:auto}
.login-box{background:#fff;border-radius:16px;padding:28px 24px;width:360px;margin:20px auto}
.login-logo{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:2px}
.login-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.login-group{margin-bottom:10px}
.login-group-label{font-size:11px;color:var(--t3);margin-bottom:5px;font-weight:600}
.login-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.login-btns.col3{grid-template-columns:1fr 1fr 1fr}
.member-btn{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--s2);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:flex;align-items:center;gap:7px;transition:.15s;text-align:left}
.member-btn:hover{border-color:var(--navy);background:var(--navy);color:#fff}
.mb-av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.member-btn:hover .mb-av{background:rgba(255,255,255,.2)}
.login-pw-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--s2);margin-bottom:8px}
.login-pw-input:focus{outline:none;border-color:var(--blue);background:#fff}
.login-pw-user{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.login-pw-back{font-size:11px;color:var(--t3);cursor:pointer;text-align:center;margin-top:8px}
.login-pw-back:hover{color:var(--navy)}
.login-err{font-size:12px;color:var(--red);min-height:16px;margin-bottom:6px}
.account-menu{position:relative;display:inline-block}
.account-menu-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:160px;z-index:200;overflow:hidden}
.account-menu-item{padding:10px 14px;font-size:12px;color:var(--t2);cursor:pointer;display:flex;align-items:center;gap:7px}
.account-menu-item:hover{background:var(--s2)}
.account-menu-item.danger{color:var(--red)}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:998;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:14px;padding:22px 20px;width:320px}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px}
/* Header */
.hdr{background:var(--navy);color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.hdr-title{font-size:15px;font-weight:700}
.hdr-right{display:flex;align-items:center;gap:10px}
.season-sel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:4px 8px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer}
.who-badge{background:var(--gold);color:var(--navy);font-weight:700;padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer}
/* Nav */
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.nav-tab{padding:12px 14px;font-size:13px;font-weight:600;color:var(--t3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:inherit;transition:.15s}
.nav-tab.on{color:var(--navy);border-bottom-color:var(--gold)}
/* Main */
.main{max-width:900px;margin:0 auto;padding:16px}
/* Cards */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;overflow:hidden}
.card-hdr{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.card-body{padding:14px 16px}
/* Form */
.field-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.field-label{font-size:12px;color:var(--t2);min-width:90px;flex-shrink:0}
.fi{padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--s2);transition:.15s}
.fi:focus{outline:none;border-color:var(--blue);background:#fff}
.fi:disabled{opacity:.6;cursor:not-allowed}
.fi-sm{width:90px}.fi-md{width:130px}
.unit{font-size:12px;color:var(--t3);flex-shrink:0}
.add-btn{padding:6px 12px;background:var(--s2);border:1.5px dashed var(--border);border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--t3);transition:.15s}
.add-btn:hover{border-color:var(--blue);color:var(--blue)}
.del-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--t3);font-size:16px;flex-shrink:0;border-radius:4px;display:flex;align-items:center;justify-content:center}
.del-btn:hover{background:var(--s3);color:var(--red)}
/* Result */
.result-bar{background:linear-gradient(135deg,var(--navy),#2a3550);border-radius:10px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.result-label{font-size:11px;opacity:.7;margin-bottom:3px}
.result-amount{font-size:22px;font-weight:800}
.result-detail{font-size:10px;opacity:.6;margin-top:2px}
/* Score bars */
.score-track{height:7px;background:var(--s3);border-radius:4px;overflow:hidden;margin-bottom:4px}
.score-fill{height:100%;border-radius:4px;transition:width .4s}
/* Table */
.task-table{width:100%;border-collapse:collapse;font-size:12px}
.task-table th{text-align:left;padding:7px 9px;color:var(--t3);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap}
.task-table td{padding:7px 9px;border-bottom:1px solid var(--s3);vertical-align:middle}
.task-table tr:last-child td{border-bottom:none}
.task-table tr:hover td{background:var(--s2)}
/* Pills */
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.pill-green{background:#dcfce7;color:#166534}
.pill-orange{background:#fff7ed;color:#9a3412}
.pill-blue{background:#eff6ff;color:#1d4ed8}
.pill-gray{background:var(--s3);color:var(--t3)}
.pill-purple{background:#f3e8ff;color:#6b21a8}
.pill-yellow{background:#fefce8;color:#854d0e}
/* Notice */
.notice{background:#fefce8;border:1px solid #fde047;border-radius:8px;padding:9px 12px;font-size:12px;color:#78600a;margin-bottom:10px;line-height:1.6}
/* Misc */
.sec-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;margin-top:14px}
.sec-label:first-child{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.mini-stat{background:var(--s2);border-radius:8px;padding:10px 12px;text-align:center}
.mini-stat-val{font-size:18px;font-weight:800;margin-bottom:1px}
.mini-stat-lbl{font-size:10px;color:var(--t3)}
.divider{height:1px;background:var(--border);margin:12px 0}
.team-chip{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px 14px;margin-bottom:12px}
.action-btn{padding:7px 16px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-green{background:#16a34a;color:#fff}
.btn-green:hover{opacity:.85}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{opacity:.85}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{opacity:.85}
select.fi{cursor:pointer}
/* Sub tabs */
.sub-nav{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sub-tab{padding:9px 14px;background:none;border:none;font-size:13px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:.15s}
.sub-tab.on{color:var(--navy);border-bottom-color:var(--gold)}
/* Toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:5px}
.toast{padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s}
.toast-ok{background:#166534;color:#fff}
.toast-err{background:#991b1b;color:#fff}
.toast-info{background:#1d4ed8;color:#fff}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.hidden{display:none!important}
/* Case card in flow */
.case-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.case-card-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.case-meta{font-size:11px;color:var(--t3);line-height:1.6}
</style>
</head>
<body>

<div class="login-wrap" id="login-page">
  <div class="login-box">
    <div class="login-logo">默聲創意</div>
    <div class="login-sub" id="login-sub-text">季度獎金計算 · 請選擇帳號</div>
    <div id="login-groups"></div>
    <div id="login-pw-step" class="hidden">
      <div class="login-pw-user" id="login-pw-user"></div>
      <input class="login-pw-input" type="password" id="login-pw-input" placeholder="請輸入密碼" maxlength="40">
      <div class="login-err" id="login-err"></div>
      <button class="action-btn btn-primary" style="width:100%;padding:10px" onclick="submitLogin()">登入</button>
      <div class="login-pw-back" onclick="backToLoginList()">← 重新選擇帳號</div>
    </div>
  </div>
</div>

<div class="hdr">
  <div class="hdr-title">💰 季度獎金計算</div>
  <div class="hdr-right">
    <select class="season-sel" id="season-sel" onchange="onSeasonChange()">
      <option value="2026-Q3">2026 Q3（7-9月）</option>
      <option value="2026-Q4">2026 Q4（10-12月）</option>
      <option value="2027-Q1">2027 Q1（1-3月）</option>
    </select>
    <div class="account-menu" id="account-menu">
      <div class="who-badge" id="who-badge" onclick="toggleAccountMenu()">登入</div>
      <div class="account-menu-dropdown hidden" id="account-menu-dropdown">
        <div class="account-menu-item" onclick="openChangePwModal()">🔑 修改密碼</div>
        <div class="account-menu-item danger" onclick="logout()">🚪 登出</div>
      </div>
    </div>
  </div>
</div>

<div class="nav" id="main-nav"></div>

<div class="main">
  <div id="pane-sales"   class="hidden"><div id="sales-content"></div></div>
  <div id="pane-pm"      class="hidden"><div id="pm-content"></div></div>
  <div id="pane-maint"   class="hidden"><div id="maint-content"></div></div>
  <div id="pane-design"  class="hidden"><div id="design-content"></div></div>
  <div id="pane-murphy"  class="hidden"><div id="murphy-content"></div></div>
  <div id="pane-admin"   class="hidden"><div id="admin-content"></div></div>
  <div id="pane-members" class="hidden"><div id="members-content"></div></div>
</div>
<div id="toast-wrap"></div>
<div id="modal-root"></div>

<script>
// ══ 常數 ══
const STORAGE_KEY='morcept_bonus_v1';
const CFG_KEY='morcept_cfg_v1';

// ══ 人員（動態，從 Firestore 載入）══
// adminLevel: 'super'=最高管理者, 'admin'=管理者, null/undefined=一般
// role: 職能角色（main/assist/member/exec/collab），與管理層級分開
const DEFAULT_MEMBERS={
  murphy: {name:'Murphy', dept:'mgmt',   role:'member', adminLevel:'super', active:true},
  annie:  {name:'Annie',  dept:'sales',  role:'main',   active:true},
  sandra: {name:'Sandra', dept:'sales',  role:'main',   active:true},
  elena:  {name:'Elena',  dept:'sales',  role:'assist', active:true},
  daniel: {name:'Daniel', dept:'pm',     role:'member', active:true},
  davis:  {name:'Davis',  dept:'pm',     role:'member', adminLevel:'super', active:true},
  shanna: {name:'Shanna', dept:'pm',     role:'member', active:true},
  jessie: {name:'Jessie', dept:'maint',  role:'member', active:true},
  max:    {name:'Max',    dept:'maint',  role:'member', active:true},
  putting:{name:'布丁',   dept:'design', role:'exec',   active:true, canAssign:true},
  rori:   {name:'RORI',   dept:'design', role:'exec',   active:true},
  mina:   {name:'MINA',   dept:'design', role:'exec',   active:true},
  john:   {name:'John',   dept:'design', role:'collab', active:true},
  lisa:   {name:'Lisa',   dept:'design', role:'collab', active:true},
};
let MEMBERS={...DEFAULT_MEMBERS};

// 動態人員輔助
function getActiveMembers(dept,role=null){
  return Object.entries(MEMBERS)
    .filter(([,m])=>m.active!==false&&m.dept===dept&&(!role||m.role===role))
    .map(([id,m])=>({id,...m}));
}
function getSalesMain()  { return getActiveMembers('sales','main');   }
function getSalesAssist(){ return getActiveMembers('sales','assist'); }
function getPMMembers()  { return getActiveMembers('pm');             }
function getMaintMembers(){ return getActiveMembers('maint');         }
function getDesignExec() { return getActiveMembers('design','exec');  }
function getDesignCollab(){ return getActiveMembers('design','collab');}

// ══ 案件狀態 ══
const CASE_STATUS={
  pending_murphy:'待指派PM', pending_pm:'待PM確認', in_progress:'PM執行中',
  pending_design:'待設計分派', designing:'設計中', done:'已結案', void:'已作廢',
};

// ══ 設定（CFG）══
let CFG={
  pool:{sales:200000, pm:80000, maint:20000, maintNew:50000, design:100000},
  salesThresholds:[
    {level:'門檻一',   salesAmt:1800000, recogAmt:900000,  rate:0.015, bonus:13500, monthly:600000,  challenge:false},
    {level:'門檻二',   salesAmt:2100000, recogAmt:1050000, rate:0.035, bonus:36750, monthly:700000,  challenge:false},
    {level:'門檻三',   salesAmt:2600000, recogAmt:1300000, rate:0.050, bonus:65000, monthly:866667,  challenge:false},
    {level:'🔥 挑戰賽', salesAmt:3000000, recogAmt:1500000, rate:0.050, bonus:65000, monthly:1000000, challenge:true, challengeBonus:20000},
  ],
  maintMode:'split',            // 'split'=平分 / 'individual'=各自獨立一包
  maintRenewThreshold:90,
  maintYearMultiplier:[{yr:1,mult:1.0},{yr:3,mult:1.2},{yr:5,mult:1.5}],
  pmCollabPool:30000,
  pmCollabThresholds:{lineOA:80,maintSpeed:85,renewRate:90},
  design:{execRatio:.6},        // 執案60%，剩餘給協作
};

// ══ 狀態 ══
let CUR_USER=null, CUR_SEASON='2026-Q3';
let DB={}, PASSWORDS={};
let _pendingLoginId=null;

// ══ Firebase 資料層 ══
function fbReady(){
  return new Promise(res=>{
    if(window.__fb){res();return;}
    window.addEventListener('fb-ready',()=>res(),{once:true});
  });
}
async function loadDB(){
  await fbReady();
  try{
    const snap=await window.__fb.getDoc(window.__fb.doc(window.__fb.db,'app','bonusDB'));
    DB=snap.exists()?JSON.parse(snap.data().data||'{}'):{};
    migrateLegacyData();
  }catch(e){console.error('loadDB',e);DB={};}
}
async function loadCFG(){
  await fbReady();
  try{
    const snap=await window.__fb.getDoc(window.__fb.doc(window.__fb.db,'app','bonusCFG'));
    if(snap.exists())Object.assign(CFG,JSON.parse(snap.data().data||'{}'));
  }catch(e){console.error('loadCFG',e);}
}
async function loadPasswords(){
  await fbReady();
  try{
    const snap=await window.__fb.getDoc(window.__fb.doc(window.__fb.db,'app','passwords'));
    if(snap.exists()){PASSWORDS=snap.data()||{};}
    else{
      PASSWORDS={};
      Object.keys(MEMBERS).forEach(id=>PASSWORDS[id]='123456');
      await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','passwords'),PASSWORDS);
    }
  }catch(e){console.error('loadPasswords',e);}
}
async function loadMembers(){
  await fbReady();
  try{
    const snap=await window.__fb.getDoc(window.__fb.doc(window.__fb.db,'app','members'));
    if(snap.exists()){
      MEMBERS=snap.data().members||DEFAULT_MEMBERS;
      // Migration：補上 adminLevel（舊資料可能沒有這個欄位）
      let dirty=false;
      // murphy 永遠是 super
      if(MEMBERS.murphy&&MEMBERS.murphy.adminLevel!=='super'){
        MEMBERS.murphy.adminLevel='super'; dirty=true;
      }
      // davis 升為 super（新制）
      if(MEMBERS.davis&&MEMBERS.davis.adminLevel!=='super'){
        MEMBERS.davis.adminLevel='super'; dirty=true;
      }
      // 舊版 role:'super'/'admin' 的人也補上 adminLevel
      Object.entries(MEMBERS).forEach(([id,m])=>{
        if(m.role==='super'&&!m.adminLevel){m.adminLevel='super';dirty=true;}
        if(m.role==='admin'&&!m.adminLevel){m.adminLevel='admin';dirty=true;}
      });
      if(dirty) await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','members'),{members:MEMBERS});
    } else {
      await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','members'),{members:DEFAULT_MEMBERS});
      MEMBERS={...DEFAULT_MEMBERS};
    }
  }catch(e){console.error('loadMembers',e);MEMBERS={...DEFAULT_MEMBERS};}
}
let _dbSaveTimer=null;
function saveDB(){
  clearTimeout(_dbSaveTimer);
  _dbSaveTimer=setTimeout(async()=>{
    try{
      await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','bonusDB'),
        {data:JSON.stringify(DB),updatedAt:Date.now(),updatedBy:CUR_USER||''});
      toast('已儲存','ok');
    }catch(e){console.error(e);toast('儲存失敗','err');}
  },350);
}
async function saveCFG(){
  try{
    await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','bonusCFG'),{data:JSON.stringify(CFG)});
  }catch(e){toast('設定儲存失敗','err');}
}
async function savePasswords(){
  try{
    await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','passwords'),PASSWORDS);
  }catch(e){toast('密碼儲存失敗','err');}
}
async function saveMembers(){
  try{
    await window.__fb.setDoc(window.__fb.doc(window.__fb.db,'app','members'),{members:MEMBERS});
    toast('人員資料已儲存','ok');
  }catch(e){toast('人員儲存失敗','err');}
}
function watchDBChanges(){
  window.__fb.onSnapshot(window.__fb.doc(window.__fb.db,'app','bonusDB'),snap=>{
    if(!snap.exists())return;
    const remote=snap.data();
    if(remote.updatedBy===CUR_USER)return;
    try{DB=JSON.parse(remote.data||'{}');if(CUR_USER)renderCurrentTab();}catch(e){}
  });
}

// ══ 資料存取器 ══
function getSeason(){if(!DB[CUR_SEASON])DB[CUR_SEASON]={cases:[],sales:{},pm:{},maint:{},design:{}};return DB[CUR_SEASON];}
function getCases(){return getSeason().cases||(getSeason().cases=[]);}
function getSales(who){const s=getSeason();if(!s.sales[who])s.sales[who]={deposits:[]};return s.sales[who];}
function getMaintData(mid){
  const s=getSeason();
  if(!s.maint)s.maint={};
  if(!s.maint[mid])s.maint[mid]={total:0,exclude:0,renew1:0,renew3:0,renew5:0};
  return s.maint[mid];
}

function getDesignGlobal(){
  const s=getSeason();
  if(!s.design)s.design={};
  if(!s.design.global)s.design.global={};
  getDesignCollab().forEach(m=>{
    if(s.design.global[m.id+'Ok']===undefined)s.design.global[m.id+'Ok']=false;
  });
  return s.design.global;
}
function getPMCollab(){
  const s=getSeason();
  if(!s.pm)s.pm={};
  if(!s.pm.collab)s.pm.collab={lineOA:0,maintSpeed:0};

}

function migrateLegacyData(){

    c.designId='shanna';

  } else {
    // 網頁案進入待設計師分派
    c.status='pending_design';

}

  html+=`<div class="notice">📅 ${seasonLabel()} · 業務填寫案件後，由 Murphy 指派 PM</div>`;

function buildSalesBlock(tid,editable){
  const myCases=getCases().filter(c=>c.salesId===tid&&c.status!=='void');
  const r=calcSalesBonus(tid);
  const maxAmt=CFG.salesThresholds[CFG.salesThresholds.length-1].salesAmt;

  return `<div class="card">
    <div class="card-hdr">
      <div class="card-title">${MEMBERS[tid].name}</div>
      <span class="pill ${r.reached?r.reached.challenge?'pill-orange':'pill-green':'pill-gray'}">

      </span>
    </div>
    <div class="card-body">
      ${editable?`<div class="sec-label">新增案件</div>
      <div id="new-case-form-${tid}">${buildNewCaseForm(tid)}</div>
      <div class="divider"></div>`:''}
      <div class="sec-label">本季案件（${myCases.length} 件）</div>
      ${myCases.length?myCases.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--s2);border-radius:7px;margin-bottom:5px;font-size:12px">
        <div style="flex:1;min-width:0">
          <strong>${c.client}</strong> &nbsp;
          ${c.caseType==='web'?c.plan||'未選方案':'平面'}${c.seoAdd?' +SEO':''}${c.customAdd?' +客製':''} &nbsp;
          ${c.outsource?`<strong>${fmt((+c.quote||0)+(+c.outsource||0))}</strong>（報價${fmt(c.quote)}+外包${fmt(c.outsource)}）`:fmt(c.quote)}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${caseStatusPill(c.status)} ${fmt(c.deposit)} 訂金
          <button onclick="openEditCaseModal('${c.id}')" title="編輯案件"
            style="background:none;border:none;cursor:pointer;padding:3px 5px;color:var(--t3);font-size:14px;line-height:1;border-radius:5px;transition:.15s"
            onmouseover="this.style.background='var(--s3)';this.style.color='var(--navy)'"
            onmouseout="this.style.background='none';this.style.color='var(--t3)'">✏️</button>
        </div>
      </div>`).join(''):`<div style="font-size:12px;color:var(--t3);padding:8px 0">尚無案件</div>`}
      <div class="divider"></div>
      <div class="sec-label">季進案業績達標進度</div>
      <div style="position:relative;height:9px;background:var(--s3);border-radius:5px;margin-bottom:22px;margin-top:8px">

        ${CFG.salesThresholds.map(th=>{
          const pos=Math.min(100,th.salesAmt/maxAmt*100);
          const hit=r.salesAmt>=th.salesAmt;
          return `<div style="position:absolute;left:${pos}%;top:-5px;transform:translateX(-50%)">
            <div style="width:2px;height:19px;background:${hit?'var(--green)':'#ccc'};margin:0 auto"></div>
            <div style="font-size:9px;color:${hit?'var(--green)':'var(--t3)'};white-space:nowrap;transform:translateX(-40%);margin-top:2px">${th.challenge?'🔥':''}${Math.round(th.salesAmt/10000)}萬</div>

        }).join('')}

        <table class="task-table" style="min-width:480px">

          <tbody>
            ${CFG.salesThresholds.map(th=>{
              const isNow=r.reached?.level===th.level;
              return `<tr style="background:${isNow?th.challenge?'#fff7ed':'#f0fdf4':''};font-weight:${isNow?700:400}">
                <td>${th.level}</td><td>${fmt(th.salesAmt)}</td><td>${fmt(th.recogAmt)}</td>
                <td style="color:${r.salesAmt>=th.salesAmt?'var(--green)':'var(--t2)'}">${(th.rate*100).toFixed(1)}%${th.challenge?' + 2萬加碼':''}</td>
                <td style="color:${isNow?'var(--green)':'var(--t2)'}">${fmt(th.challenge?th.bonus+th.challengeBonus:th.bonus)}</td>

    </div>
  </div>`;

function submitNewCase(tid){
  const client=document.getElementById('nc-client-'+tid)?.value?.trim();
  if(!client){toast('請填寫客戶名稱','err');return;}
  const type=document.querySelector(`[name="nc-type-${tid}"]:checked`)?.value||'web';
  let plan='';
  const customWeb=type==='web'?!!(document.getElementById('nc-custom-web-'+tid)?.checked):false;
  const customFlat=type==='flat'?!!(document.getElementById('nc-custom-flat-'+tid)?.checked):false;
  const customAdd=customWeb||customFlat;
  if(type==='web'){
    const checked=[...document.querySelectorAll(`[name="nc-plan-${tid}"]:checked`)].map(el=>el.value);
    const otherChk=document.getElementById('nc-plan-other-chk-'+tid)?.checked;
    if(otherChk){
      const planOther=document.getElementById('nc-plan-other-'+tid)?.value?.trim()||'';
      if(planOther) checked.push('其他：'+planOther);
    }
    plan=checked.join('、');
  }
  const seo=type==='web'?!!(document.getElementById('nc-seo-'+tid)?.checked):false;
  const flatDesc=type==='flat'?(document.getElementById('nc-flat-desc-'+tid)?.value||''):'';
  const quote=document.getElementById('nc-quote-'+tid)?.value||0;
  const outsource=customAdd?(document.getElementById('nc-outsource-'+tid)?.value||0):0;
  const deposit=document.getElementById('nc-deposit-'+tid)?.value||0;
  addCase(tid,client,type,plan,seo,customAdd,flatDesc,quote,outsource,deposit);
  toast(`${client} 已送出，等待指派`,'info');
  renderSalesPane();
}

// 銷售計算
// ══ 業務計算（新制：季進案業績×50%認列，對應門檻×係數=實領）══
function calcSalesBonus(tid){
  const myCases=getCases().filter(c=>c.salesId===tid&&c.status!=='void');
  const salesAmt=myCases.reduce((s,c)=>s+(+c.quote||0),0);
  const recogAmt=Math.round(salesAmt*0.5);
  const doneAmt=myCases.filter(c=>c.status==='done').reduce((s,c)=>s+(+c.quote||0),0);
  const doneCount=myCases.filter(c=>c.status==='done').length;
  const ths=[...CFG.salesThresholds].sort((a,b)=>b.salesAmt-a.salesAmt);
  const reached=ths.find(t=>salesAmt>=t.salesAmt)||null;
  const bonus=reached?reached.bonus:0;
  const challengeBonus=reached?.challenge?reached.challengeBonus:0;
  const totalBonus=bonus+challengeBonus;
  return {salesAmt,recogAmt,doneAmt,doneCount,reached,bonus,challengeBonus,totalBonus,isChallenge:!!reached?.challenge};
}
function calcAutoTeamRate(){
  const cases=getCases().filter(c=>c.pmId&&c.caseType==='web'&&c.status!=='void');
  const total=cases.length,done=cases.filter(c=>c.status==='done').length;
  return {totalTasks:total,doneTasks:done,rate:total>0?done/total:0};
}
function setManualTeamRate(val){
  const s=getSeason();if(!s.sales)s.sales={};
  s.sales.manualTeamRate=(val===''||val==null)?null:Math.min(100,Math.max(0,+val));
  saveDB();updateTeamResult();
}
function calcElenaBonus(){
  const mainMembers=getSalesMain();
  const assistMembers=getSalesAssist();
  const triggeredCount=mainMembers.filter(m=>calcSalesBonus(m.id).reached).length;
  const mainUsed=mainMembers.reduce((s,m)=>s+calcSalesBonus(m.id).totalBonus,0);
  const elenaPool=Math.max(0,CFG.pool.sales-mainUsed);
  const perTrigger=mainMembers.length>0?Math.round(elenaPool/mainMembers.length):0;
  const perAssist=assistMembers.length>0?Math.round(perTrigger/assistMembers.length):0;
  return {triggeredCount,totalMain:mainMembers.length,elenaPool,perAssist,
    bonus:triggeredCount*perAssist,assistCount:assistMembers.length};
}
function updateElenaResult(){
  const el=document.getElementById('elena-result');
  const pill=document.getElementById('elena-pill');
  if(!el)return;
  const mainMembers=getSalesMain();
  const r=calcElenaBonus();
  if(pill)pill.innerHTML=r.bonus>0?`<span class="pill pill-green">預估 ${fmt(r.bonus)}</span>`:`<span class="pill pill-gray">尚無達標</span>`;
  el.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
    ${mainMembers.map(m=>{const ok=!!calcSalesBonus(m.id).reached;
      return `<div style="padding:8px 11px;background:${ok?'#dcfce7':'var(--s2)'};border-radius:8px;border-left:3px solid ${ok?'var(--green)':'var(--border)'};font-size:12px;font-weight:600">
        ${m.name} ${ok?'✅ 達標':'⏳ 未達標'}</div>`;}).join('')}
  </div>
  <div class="result-bar"><div>
    <div class="result-label">助理預估可領（${r.assistCount}人平分）</div>
    <div class="result-amount">${fmt(r.bonus)}</div>
    <div class="result-detail">${r.triggeredCount}/${r.totalMain} 位達標，各 ${fmt(r.perAssist)}</div>
  </div></div>`;
}
function updateTeamResult(){
  const el=document.getElementById('team-result');
  if(!el)return;
  const s=getSeason();
  const auto=calcAutoTeamRate();
  const manual=s.sales?.manualTeamRate;
  const isAuto=(manual===undefined||manual===null||manual==='');
  const rate=isAuto?auto.rate:(+manual/100);
  const teamReached=rate>0.6;
  const mainMembers=getSalesMain();
  const mainUsed=mainMembers.reduce((s,m)=>s+calcSalesBonus(m.id).totalBonus,0);
  const remain=Math.max(0,CFG.pool.sales-mainUsed);
  const each=teamReached&&mainMembers.length>0?Math.round(remain*rate/mainMembers.length):0;
  el.innerHTML=teamReached
    ?`<div style="display:flex;flex-wrap:wrap;gap:6px">
        ${mainMembers.map(m=>`<div class="mini-stat"><div class="mini-stat-val" style="color:var(--green)">${fmt(each)}</div><div class="mini-stat-lbl">${m.name} 合作獎金</div></div>`).join('')}
      </div>
      <div style="font-size:11px;color:var(--t3);margin-top:7px">結案率 ${Math.round(rate*100)}% > 60% · 12月發放</div>`
    :`<div style="font-size:12px;color:var(--t3);padding:8px 0">結案率未達 60%，合作獎金本季不啟動</div>`;
}

function setPMCollabField(key,val){const d=getPMCollab();d[key]=val;saveDB();renderPMPane();}
function caseTotal(c){return (+c.quote||0)+(+c.outsource||0);}

function calcPMShare(tid){
  const pmIds=getPMMembers().map(m=>m.id);
  const doneCases=getCasesByPM(tid).filter(c=>c.status==='done');
  const doneAmt=doneCases.reduce((s,c)=>s+caseTotal(c),0);
  const doneCount=doneCases.length;
  const totalAmt=pmIds.reduce((sum,id)=>
    sum+getCasesByPM(id).filter(c=>c.status==='done').reduce((s,c)=>s+caseTotal(c),0),0);
  const bonus=totalAmt>0?Math.round(doneAmt/totalAmt*CFG.pool.pm):0;
  return {doneAmt,doneCount,totalAmt,bonus};
}

function calcMaintNewCaseShare(mid){
  const maintIds=getMaintMembers().map(m=>m.id);
  const doneCases=getCasesByPM(mid).filter(c=>c.status==='done');
  const doneAmt=doneCases.reduce((s,c)=>s+caseTotal(c),0);
  const doneCount=doneCases.length;
  const totalAmt=maintIds.reduce((sum,id)=>
    sum+getCasesByPM(id).filter(c=>c.status==='done').reduce((s,c)=>s+caseTotal(c),0),0);
  const pool=CFG.pool.maintNew||0;
  const bonus=totalAmt>0?Math.round(doneAmt/totalAmt*pool):0;
  return {doneAmt,doneCount,totalAmt,bonus,pool};
}
function calcPMCollabBonus(){
  const d=getPMCollab();
  const th=CFG.pmCollabThresholds||{lineOA:80,maintSpeed:85,renewRate:90};
  const lineOA=+d.lineOA||0, maintSpeed=+d.maintSpeed||0;
  const renewRate=calcMaintBonus().weightedRate;
  const ok1=lineOA>=th.lineOA,ok2=maintSpeed>=th.maintSpeed,ok3=renewRate>=th.renewRate;
  const allOk=ok1&&ok2&&ok3;
  const pmCount=getPMMembers().length;
  const perPerson=allOk&&pmCount>0?Math.round((CFG.pmCollabPool||30000)/pmCount):0;
  return {lineOA,maintSpeed,renewRate,ok1,ok2,ok3,allOk,perPerson,pool:CFG.pmCollabPool||30000};
}

// 計算單一維運人員加權續約率
function calcMaintBonusForOne(mid){
  const d=getMaintData(mid);
  const total=+d.total||0;
  const excl=Math.min(+d.exclude||0,total);
  const validTotal=total-excl;
  const threshold=CFG.maintRenewThreshold||90;
  const neededRenew=Math.round(validTotal*(threshold/100));
  const renew1=+d.renew1||0,renew3=+d.renew3||0,renew5=+d.renew5||0;
  const mult=CFG.maintYearMultiplier||[{yr:1,mult:1.0},{yr:3,mult:1.2},{yr:5,mult:1.5}];
  const m1=mult.find(x=>x.yr===1)?.mult||1.0;
  const m3=mult.find(x=>x.yr===3)?.mult||1.2;
  const m5=mult.find(x=>x.yr===5)?.mult||1.5;
  const weightedRenewed=Math.round((renew1*m1+renew3*m3+renew5*m5)*10)/10;
  const weightedRate=neededRenew>0?Math.round(weightedRenewed/neededRenew*100):0;
  const reached=weightedRate>=threshold;
  return {total,excl,validTotal,neededRenew,renew1,renew3,renew5,weightedRenewed,weightedRate,reached};
}
// 計算所有維運人員獎金（平分或各自獨立）
function calcMaintBonus(){
  const maintPeople=getMaintMembers();
  const mode=CFG.maintMode||'split';
  const pool=CFG.pool.maint||20000;
  const results=maintPeople.map(m=>({...m,...calcMaintBonusForOne(m.id),bonus:0}));
  if(mode==='individual'){
    results.forEach(r=>{r.bonus=r.reached?pool:0;});
  } else {
    const perPerson=maintPeople.length>0?Math.round(pool/maintPeople.length):0;
    results.forEach(r=>{r.bonus=r.reached?perPerson:0;});
  }
  const totalBonus=results.reduce((s,r)=>s+r.bonus,0);
  const first=results[0]||{weightedRate:0,reached:false,bonus:0,neededRenew:0,weightedRenewed:0};
  return {results,mode,pool,totalBonus,
    weightedRate:first.weightedRate,reached:first.reached,bonus:first.bonus,
    neededRenew:first.neededRenew,weightedRenewed:first.weightedRenewed};
}

function calcDesignBonus(){
  const pool=CFG.pool.design||0;
  const execRatio=CFG.design?.execRatio||0.6;
  const execPool=Math.round(pool*execRatio);
  const collabPool=pool-execPool;
  const teamBonusPerPerson=2000; // 結案率>60%全員各2000（原部長獎金改制）

  // 執案設計師（動態）
  const execMembers=getDesignExec();
  const execAmts={},execBonus={};
  let totalAmt=0;
  execMembers.forEach(m=>{
    const amt=getCasesByDesigner(m.id).filter(c=>c.status==='done').reduce((s,c)=>s+caseTotal(c),0);
    execAmts[m.id]=amt;totalAmt+=amt;
  });
  execMembers.forEach(m=>{execBonus[m.id]=totalAmt>0?Math.round(execAmts[m.id]/totalAmt*execPool):0;});

  // 部門結案率（只計算網頁案）
  const allDesign=getCases().filter(c=>c.designId&&c.caseType==='web'&&c.status!=='void');
  const doneDesign=allDesign.filter(c=>c.status==='done');
  const deptRate=allDesign.length>0?doneDesign.length/allDesign.length:0;
  const deptReached=deptRate>=0.6;

  // 協作設計師（動態）
  const collabMembers=getDesignCollab();
  const g=getDesignGlobal();
  const collabPerPerson=deptReached&&collabMembers.length>0?Math.round(collabPool/collabMembers.length):0;
  const collabBonus={},collabIndv={};
  collabMembers.forEach(m=>{
    collabBonus[m.id]=collabPerPerson;
    collabIndv[m.id]=deptReached&&g[m.id+'Ok']?Math.round(pool*.05):0;
  });

  // 全員團隊績效
  const allDesignMembers=[...execMembers,...collabMembers];
  const teamBonus=deptReached?teamBonusPerPerson:0;
  const teamBonusTotal=teamBonus*allDesignMembers.length;

  // 向下相容欄位
  const johnTeam=collabBonus['john']||0;
  const lisaTeam=collabBonus['lisa']||0;
  const johnIndv=collabIndv['john']||0;
  const lisaIndv=collabIndv['lisa']||0;

  return {execPool,collabPool,execAmts,totalAmt,execBonus,execMembers,
    collabMembers,collabBonus,collabIndv,collabPerPerson,
    deptRate,deptReached,allDesign,doneDesign,
    teamBonus,teamBonusTotal,allDesignMembers,
    johnTeam,lisaTeam,johnIndv,lisaIndv,bevicBonus:0};
}

function renderAdminSummary(){
  const el=document.getElementById('admin-sub');
  if(!el)return;
  const s=getSeason();
  const mainMembers=getSalesMain();
  const assistMembers=getSalesAssist();
  const pmMembers=getPMMembers();
  const maintMembers=getMaintMembers();
  const dr=calcDesignBonus();
  const maint=calcMaintBonus();
  const elenaR=calcElenaBonus();
  const auto=calcAutoTeamRate();
  const manual=s.sales?.manualTeamRate;
  const isAuto=(manual===undefined||manual===null||manual==='');
  const teamRate=isAuto?auto.rate:(+manual/100);
  const teamReached=teamRate>0.6;

  // PM 結案佔比
  const pmShares=pmMembers.map(m=>{
    const cases=getCasesByPM(m.id).filter(c=>c.status==='done');
    const doneAmt=cases.reduce((s,c)=>s+caseTotal(c),0);
    return {...m,doneAmt};
  });
  const pmTotal=pmShares.reduce((s,m)=>s+m.doneAmt,0);
  pmShares.forEach(m=>{m.bonus=pmTotal>0?Math.round(m.doneAmt/pmTotal*CFG.pool.pm):0;});

  // PM 協作團績
  const collabR=calcPMCollabBonus();
  const collabEach=collabR.allOk?collabR.perPerson:0;

  const salesTotal=mainMembers.reduce((s,m)=>s+calcSalesBonus(m.id).totalBonus,0);
  const mainUsed=mainMembers.reduce((s,m)=>s+calcSalesBonus(m.id).totalBonus,0);
  const remain=Math.max(0,CFG.pool.sales-mainUsed);
  const teamEach=teamReached&&mainMembers.length>0?Math.round(remain*teamRate/mainMembers.length):0;

  const designExecTotal=Object.values(dr.execBonus).reduce((s,v)=>s+v,0);
  const designCollabTotal=dr.collabMembers.reduce((s,m)=>s+(dr.collabBonus[m.id]||0)+(dr.collabIndv[m.id]||0),0);
  const designTeamTotal=(dr.teamBonus||0)*dr.allDesignMembers.length;
  const total=salesTotal+elenaR.bonus
    +teamEach*mainMembers.length
    +pmShares.reduce((s,m)=>s+m.bonus,0)+collabEach*pmMembers.length
    +maint.totalBonus
    +designExecTotal+designCollabTotal+designTeamTotal;

  el.innerHTML=`
    <div class="card" style="margin-bottom:12px">
      <div class="card-hdr"><div class="card-title">📊 ${seasonLabel()} 獎金總覽</div></div>
      <div class="card-body" style="padding:0">
        <table class="task-table">
          <thead><tr><th>人員</th><th>部門</th><th>主要獎金</th><th>加項</th><th>預估合計</th></tr></thead>
          <tbody>
            <tr style="background:var(--s2)"><td colspan="5" style="padding:5px 9px;font-size:10px;color:var(--t3)">── 業務部 · 總池 ${fmt(CFG.pool.sales)} ──</td></tr>
            ${mainMembers.map(m=>{
              const r=calcSalesBonus(m.id);
              return `<tr><td><strong>${m.name}</strong></td><td style="color:var(--t3)">業務</td>
                <td>${fmt(r.totalBonus)}</td>
                <td>${teamReached?'+'+fmt(teamEach)+' 合作':'—'}</td>
                <td><strong style="color:var(--green)">${fmt(r.totalBonus+teamEach)}</strong></td></tr>`;
            }).join('')}
            ${assistMembers.map(m=>`<tr><td><strong>${m.name}</strong></td><td style="color:var(--t3)">業務助理</td>
              <td colspan="2" style="color:var(--t3);font-size:12px">${elenaR.triggeredCount}/${elenaR.totalMain} 位達標</td>
              <td><strong style="color:var(--green)">${fmt(elenaR.bonus)}</strong></td></tr>`).join('')}
            <tr style="background:var(--s2)"><td colspan="5" style="padding:5px 9px;font-size:10px;color:var(--t3)">── 專案部 · 分潤池 ${fmt(CFG.pool.pm)}，總結案金額 ${fmt(pmTotal)} · 協作團績 ${collabR.allOk?'✅ 達標':'未達標'} ──</td></tr>
            ${pmShares.map(m=>`<tr><td><strong>${m.name}</strong></td><td style="color:var(--t3)">專案</td>
              <td>${fmt(m.doneAmt)} (${pmTotal>0?Math.round(m.doneAmt/pmTotal*100):0}%)</td>
              <td>${collabEach?'+'+fmt(collabEach)+' 協作':'—'}</td>
              <td><strong style="color:var(--green)">${fmt(m.bonus+collabEach)}</strong></td></tr>`).join('')}
            <tr style="background:var(--s2)"><td colspan="5" style="padding:5px 9px;font-size:10px;color:var(--t3)">── 維運 · 獎金池 ${fmt(CFG.pool.maint)} · ${maint.mode==='split'?'平分':'各自獨立'} ──</td></tr>
            ${maint.results.map(r=>`<tr><td><strong>${r.name}</strong></td><td style="color:var(--t3)">維運</td>
              <td>${r.weightedRate}% ${r.reached?'✅':'⏳'}</td><td>—</td>
              <td><strong style="color:var(--green)">${fmt(r.bonus)}</strong></td></tr>`).join('')}
            <tr style="background:var(--s2)"><td colspan="5" style="padding:5px 9px;font-size:10px;color:var(--t3)">── 設計部 · 執案池 ${fmt(dr.execPool)}，總結案金額 ${fmt(dr.totalAmt)}${dr.deptReached?' · 全員團隊績效各 '+fmt(dr.teamBonus):''}  ──</td></tr>
            ${dr.execMembers.map(m=>`<tr><td><strong>${m.name}</strong></td><td style="color:var(--t3)">執案</td>
              <td>${fmt(dr.execAmts[m.id]||0)} (${dr.totalAmt>0?Math.round((dr.execAmts[m.id]||0)/dr.totalAmt*100):0}%)</td>
              <td>${dr.teamBonus?'+'+fmt(dr.teamBonus):''}</td>
              <td><strong style="color:var(--green)">${fmt((dr.execBonus[m.id]||0)+(dr.teamBonus||0))}</strong></td></tr>`).join('')}
            ${dr.collabMembers.map(m=>`<tr><td><strong>${m.name}</strong></td><td style="color:var(--t3)">協作</td>
              <td>團 ${fmt(dr.collabBonus[m.id]||0)} + 個 ${fmt(dr.collabIndv[m.id]||0)}</td>
              <td>${dr.teamBonus?'+'+fmt(dr.teamBonus):''}</td>
              <td><strong style="color:var(--green)">${fmt((dr.collabBonus[m.id]||0)+(dr.collabIndv[m.id]||0)+(dr.teamBonus||0))}</strong></td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="result-bar">
      <div><div class="result-label">本季預估總發放</div><div class="result-amount">${fmt(total)}</div></div>
      <div style="text-align:right;font-size:12px;opacity:.7">獎金池 ${fmt(CFG.pool.sales+CFG.pool.pm+CFG.pool.maint+CFG.pool.design)}</div>
    </div>`;
}

  const DEPT_LABELS={mgmt:'管理',sales:'業務',pm:'專案',maint:'維運',design:'設計'};
  el.innerHTML=`

          <input class="fi fi-sm" type="number" min="0" max="100"

        <table class="task-table">
          <thead><tr><th>成員</th><th>部門</th><th></th></tr></thead>
          <tbody>
            ${Object.entries(MEMBERS).filter(([,m])=>m.active!==false).map(([id,m])=>`

                <td><button class="action-btn" style="background:var(--s3);color:var(--t2);font-size:11px;padding:5px 10px" onclick="openResetPwModal('${id}')">重置密碼</button></td>

// ══ 人員管理分頁 ══
const DEPT_LABELS_M={mgmt:'管理',sales:'業務',pm:'專案',maint:'維運',design:'設計'};
const ROLE_OPTIONS={
  mgmt: [{v:'member',l:'管理人員'}],
  sales:[{v:'main',l:'主要業務'},{v:'assist',l:'業務助理'}],
  pm:   [{v:'member',l:'PM'}],
  maint:[{v:'member',l:'維運人員'}],
  design:[{v:'exec',l:'執案設計師'},{v:'collab',l:'協作設計師'}],
};
const ADMIN_LEVEL_OPTIONS=[
  {v:'',    l:'一般（無管理權限）'},
  {v:'admin',l:'管理者'},
  {v:'super',l:'最高管理者'},
];
function renderMembersPane(){
  const el=document.getElementById('members-content');
  if(!el)return;
  const depts=['mgmt','sales','pm','maint','design'];

  const adminLabel=(m)=>{
    if(m.adminLevel==='super') return '<span class="pill pill-orange">最高管理者</span>';
    if(m.adminLevel==='admin') return '<span class="pill pill-purple">管理者</span>';
    return '';
  };

  el.innerHTML=`
    <div class="card" style="margin-bottom:12px">
      <div class="card-hdr"><div class="card-title">👥 人員管理</div></div>
      <div class="card-body">
        <div class="notice">新增成員後即可登入並參與對應部門的獎金計算。停用成員不影響歷史資料。</div>
        ${depts.map(dept=>{
          const deptMembers=Object.entries(MEMBERS).filter(([,m])=>m.dept===dept);
          if(!deptMembers.length)return '';
          return `<div style="margin-bottom:16px">
            <div class="sec-label">${DEPT_LABELS_M[dept]}</div>
            <table class="task-table">
              <thead><tr><th>名稱</th><th>職能角色</th><th>管理層級</th><th>狀態</th><th>操作</th></tr></thead>
              <tbody>
                ${deptMembers.map(([id,m])=>`<tr style="${m.active===false?'opacity:.45':''}">
                  <td><strong>${m.name}</strong></td>
                  <td style="color:var(--t3)">${ROLE_OPTIONS[dept]?.find(r=>r.v===m.role)?.l||m.role}</td>
                  <td>${adminLabel(m)}</td>
                  <td>${m.active===false?'<span class="pill pill-gray">停用</span>':'<span class="pill pill-green">啟用</span>'}</td>
                  <td style="display:flex;gap:5px;flex-wrap:wrap">
                    ${m.active!==false
                      ?`<button class="action-btn" style="background:var(--s3);color:var(--t2);font-size:11px;padding:4px 9px" onclick="toggleMember('${id}',false)">停用</button>`
                      :`<button class="action-btn btn-primary" style="font-size:11px;padding:4px 9px" onclick="toggleMember('${id}',true)">恢復</button>`}
                    ${m.dept==='design'?`<button class="action-btn" style="background:${m.canAssign?'#dcfce7':'var(--s3)'};color:${m.canAssign?'var(--green)':'var(--t2)'};font-size:11px;padding:4px 9px" onclick="toggleCanAssign('${id}')">${m.canAssign?'✅ 可分派':'分派權限'}</button>`:''}
                    <button class="action-btn" style="background:var(--s3);color:var(--t2);font-size:11px;padding:4px 9px" onclick="openEditAdminLevel('${id}')">⚙️ 權限</button>
                    ${isSuper(CUR_USER)&&id!=='murphy'&&id!==CUR_USER?`<button class="action-btn" style="background:#fee2e2;color:var(--red);font-size:11px;padding:4px 9px" onclick="deleteMember('${id}')">刪除</button>`:''}
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-hdr"><div class="card-title">➕ 新增成員</div></div>
      <div class="card-body">
        <div class="field-row">
          <span class="field-label">姓名</span>
          <input class="fi fi-md" id="new-member-name" type="text" placeholder="輸入姓名" maxlength="20">
        </div>
        <div class="field-row">
          <span class="field-label">部門</span>
          <select class="fi fi-md" id="new-member-dept" onchange="updateRoleOptions()">
            ${depts.map(d=>`<option value="${d}">${DEPT_LABELS_M[d]}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <span class="field-label">職能角色</span>
          <select class="fi fi-md" id="new-member-role">
            ${(ROLE_OPTIONS['mgmt']||[]).map(r=>`<option value="${r.v}">${r.l}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <span class="field-label">管理層級</span>
          <select class="fi fi-md" id="new-member-admin-level">
            ${ADMIN_LEVEL_OPTIONS.map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <span class="field-label">帳號ID</span>
          <input class="fi fi-md" id="new-member-id" type="text" placeholder="英文小寫，例如 david" maxlength="20">
          <span style="font-size:11px;color:var(--t3)">不可重複，不可修改</span>
        </div>
        <div id="new-member-design-extra" class="hidden" style="margin-top:6px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;background:var(--s2);border-radius:8px;font-size:13px">
            <input type="checkbox" id="new-member-can-assign">
            擁有網頁案分派權限（可將待分派案件指定給執案設計師）
          </label>
        </div>
        <button class="action-btn btn-primary" style="margin-top:10px" onclick="addNewMember()">✅ 新增成員</button>
      </div>
    </div>`;
}
function updateRoleOptions(){
  const dept=document.getElementById('new-member-dept')?.value;
  const roleEl=document.getElementById('new-member-role');
  const extraEl=document.getElementById('new-member-design-extra');
  if(!roleEl||!dept)return;
  roleEl.innerHTML=(ROLE_OPTIONS[dept]||[]).map(r=>`<option value="${r.v}">${r.l}</option>`).join('');
  // 只有設計部門才顯示分派權限
  if(extraEl) extraEl.classList.toggle('hidden', dept!=='design');
}
function addNewMember(){
  const name=document.getElementById('new-member-name')?.value?.trim();
  const dept=document.getElementById('new-member-dept')?.value;
  const role=document.getElementById('new-member-role')?.value;
  const id=document.getElementById('new-member-id')?.value?.trim().toLowerCase();
  if(!name){toast('請填寫姓名','err');return;}
  if(!id){toast('請填寫帳號ID','err');return;}
  if(!/^[a-z0-9_]+$/.test(id)){toast('帳號ID只能使用英文小寫、數字、底線','err');return;}
  if(MEMBERS[id]){toast('此帳號ID已存在','err');return;}
  const canAssign=dept==='design'?!!(document.getElementById('new-member-can-assign')?.checked):false;
  const adminLevelVal=document.getElementById('new-member-admin-level')?.value||'';
  MEMBERS[id]={name,dept,role,active:true,
    ...(adminLevelVal?{adminLevel:adminLevelVal}:{}),
    ...(canAssign?{canAssign:true}:{})};
  PASSWORDS[id]='123456';
  saveMembers();savePasswords();
  document.getElementById('new-member-name').value='';
  document.getElementById('new-member-id').value='';
  renderMembersPane();
  toast(`${name} 已新增，預設密碼 123456`,'ok');
}
function openEditAdminLevel(id){
  if(!MEMBERS[id])return;
  const m=MEMBERS[id];
  const cur=m.adminLevel||'';
  document.getElementById('modal-root').innerHTML=`
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal-box">
        <div class="modal-title">⚙️ 修改管理層級</div>
        <div style="font-size:12px;color:var(--t3);margin-bottom:14px">
          成員：<strong>${m.name}</strong>（${DEPT_LABELS_M[m.dept]||m.dept}）
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
          ${ADMIN_LEVEL_OPTIONS.map(o=>`
            <label style="display:flex;align-items:center;gap:9px;cursor:pointer;padding:9px 12px;background:${cur===o.v?'#eff6ff':'var(--s2)'};border-radius:8px;border:1.5px solid ${cur===o.v?'var(--blue)':'transparent'}">
              <input type="radio" name="edit-admin-level" value="${o.v}" ${cur===o.v?'checked':''}>
              <div>
                <div style="font-size:13px;font-weight:600">${o.l}</div>
                <div style="font-size:11px;color:var(--t3)">${
                  o.v===''?'只能看自己部門的分頁':
                  o.v==='admin'?'可看所有分頁、管理設定、但不能刪人':
                  '全部權限，包含刪除成員'
                }</div>
              </div>
            </label>`).join('')}
        </div>
        <div style="display:flex;gap:8px">
          <button class="action-btn" style="flex:1;background:var(--s3);color:var(--t2)" onclick="closeModal()">取消</button>
          <button class="action-btn btn-primary" style="flex:1" onclick="submitEditAdminLevel('${id}')">確認修改</button>
        </div>
      </div>
    </div>`;
}
function submitEditAdminLevel(id){
  if(!MEMBERS[id])return;
  const val=document.querySelector('input[name="edit-admin-level"]:checked')?.value;
  if(val===undefined){closeModal();return;}
  if(val==='') delete MEMBERS[id].adminLevel;
  else MEMBERS[id].adminLevel=val;
  saveMembers();closeModal();
  renderMembersPane();
  toast(`${MEMBERS[id].name} 管理層級已更新`,'ok');
}
function toggleCanAssign(id){
  saveMembers();
  renderMembersPane();
  toast(`${MEMBERS[id].name} 分派權限已${MEMBERS[id].canAssign?'開啟':'關閉'}`,'ok');
}
function toggleMember(id,active){
  if(!MEMBERS[id])return;
  if(!active&&id===CUR_USER){toast('無法停用目前登入的帳號','err');return;}
  MEMBERS[id].active=active;
  saveMembers();renderMembersPane();
  toast(`${MEMBERS[id].name} 已${active?'恢復':'停用'}`,'ok');
}
function deleteMember(id){
  if(!MEMBERS[id])return;
  if(id===CUR_USER){toast('無法刪除目前登入的帳號','err');return;}
  if(!confirm(`確定要永久刪除「${MEMBERS[id].name}」嗎？此操作無法復原。`))return;
  delete MEMBERS[id];delete PASSWORDS[id];
  saveMembers();savePasswords();renderMembersPane();
  toast('成員已刪除','ok');
}

function getNestedCFG(key){const parts=key.split('.');let v=CFG;for(const p of parts)v=v?.[p];return v??'';}
function setNestedCFG(key,val){const parts=key.split('.');let v=CFG;for(let i=0;i<parts.length-1;i++)v=v[parts[i]];v[parts[parts.length-1]]=val;}

// ── Init ──
async function initApp(){
  await fbReady();
  await Promise.all([loadDB(),loadCFG(),loadPasswords(),loadMembers()]);
  buildLoginList();
  watchDBChanges();
  // 重新整理後自動還原登入狀態
  const saved=sessionStorage.getItem('bonusUser');
  if(saved&&MEMBERS[saved]&&MEMBERS[saved].active!==false){
    loginAs(saved);
  }
}
initApp();
</script>
